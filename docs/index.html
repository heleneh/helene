<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>helene &middot; under construction</title>
<meta name="description" content="helenehahn.de is currently being rebuilt.">
<meta name="robots" content="noindex">
<style>
  :root {
    --ink: #39424e;
    --muted: #7a8492;
    --line: #dadada;
    --paper: #f7f6f4;
    --coral: #ec8d81;
    --sand: #e7b788;
    --blue: #8ea9e8;
    --violet: #8d82c4;
    --mint: #87c5a4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: "Didact Gothic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 30rem;
    text-align: center;
  }
  .art { width: 100%; height: auto; display: block; margin: 0 auto 2.5rem; }
  h1 {
    margin: 0 0 .75rem;
    font-size: clamp(1.6rem, 6vw, 2.25rem);
    font-weight: 400;
    letter-spacing: .12em;
    text-transform: lowercase;
  }
  p {
    margin: 0 auto;
    max-width: 24rem;
    font-size: 1.0625rem;
    line-height: 1.65;
    color: var(--muted);
  }
  .rule {
    width: 3rem;
    height: 1px;
    margin: 1.5rem auto;
    border: 0;
    background: var(--line);
  }
  .mark {
    margin-top: 2.5rem;
    font-size: .75rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: #aab1ba;
  }
  .spin { transform-origin: 200px 96px; animation: spin 14s linear infinite; }
  .float-a { animation: float 5s ease-in-out infinite; }
  .float-b { animation: float 5s ease-in-out infinite; animation-delay: -2.5s; }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes pulse {
    0%, 100% { opacity: .25; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin, .float-a, .float-b, .pulse { animation: none; }
  }
</style>
</head>
<body>
<main>
  <svg class="art" viewBox="0 0 400 240" role="img" aria-label="An illustration of a half-built structure on a drawing board">
    <title>Under construction</title>
    <defs>
      <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M16 0H0V16" fill="none" stroke="#e4e2de" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="40" y="16" width="320" height="176" fill="url(#grid)" opacity=".9"/>
    <rect x="40" y="16" width="320" height="176" fill="none" stroke="#e4e2de" stroke-width="1"/>
    <g class="spin" fill="none" stroke="var(--line)" stroke-width="2">
      <circle cx="200" cy="96" r="34"/>
      <circle cx="200" cy="96" r="12"/>
      <g stroke-linecap="round">
        <path d="M200 54v-10M200 148v10M158 96h-10M242 96h10"/>
        <path d="M170.3 66.3l-7.1-7.1M229.7 125.7l7.1 7.1M170.3 125.7l-7.1 7.1M229.7 66.3l7.1-7.1"/>
      </g>
    </g>
    <path d="M60 176h280" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <g stroke="var(--ink)" stroke-width="2" stroke-linejoin="round">
      <rect x="96" y="140" width="36" height="36" fill="var(--coral)"/>
      <rect x="132" y="140" width="36" height="36" fill="var(--sand)"/>
      <rect x="168" y="140" width="36" height="36" fill="var(--mint)"/>
      <rect x="114" y="104" width="36" height="36" fill="var(--blue)"/>
      <rect x="150" y="104" width="36" height="36" fill="var(--violet)"/>
    </g>
    <g class="float-a">
      <rect x="132" y="58" width="36" height="36" fill="#fff"
            stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
    </g>
    <g class="float-b" fill="none" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 5">
      <rect x="248" y="140" width="30" height="30"/>
      <rect x="286" y="140" width="30" height="30"/>
      <rect x="267" y="106" width="30" height="30"/>
    </g>
    <g stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" opacity=".5">
      <path d="M60 200h88M60 196v8M148 196v8"/>
    </g>
    <g class="pulse" fill="var(--coral)">
      <circle cx="330" cy="204" r="4"/>
    </g>
  </svg>

  <h1>under construction</h1>
  <hr class="rule">
  <p>This site is being rebuilt.</p>
  <p class="mark">helenehahn.de</p>
</main>
</body>
</html>
